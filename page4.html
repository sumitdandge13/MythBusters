<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MythBusters - System Notice</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            
            background-image: url('BG_02.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Phone Stage Area */
        .stage {
            width: 100%;
            max-width: 380px;
            height: 600px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            overflow: hidden;
        }

        /* Page Heading */
        .top-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.3s;
        }

        /* Subscription Card */
        .notice-card {
            width: 90%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 24px 20px;
            margin-top: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            opacity: 0;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.8s;
        }

        .notice-tag {
            background: #fee2e2;
            color: #991b1b;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .notice-title {
            font-size: 1.25rem;
            color: #1e293b;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .notice-subtext {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Single Character at Bottom */
        .character-container {
            position: absolute;
            bottom: -20px;
            width: 180px;
            height: 250px;
            z-index: 5;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 0.5s;
        }

        .character-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
            transform: scale(1.3);
            transform-origin: bottom center;
        }

        /* Auto Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: #ffffff;
            color: #1e293b;
            padding: 10px 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-text {
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            white-space: nowrap;
        }

        .bubble-btn {
            background: #2b5c53;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(43, 92, 83, 0.3);
            transition: transform 0.2s ease;
        }

        .bubble-btn:active {
            transform: scale(0.95);
        }

        .speech-bubble.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        /* Keyframes */
        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="stage">
        <h2 class="top-title">System Alert</h2>

        <!-- Paywall Notice Card -->
        <div class="notice-card">
            <span class="notice-tag">Subscription Limit</span>
            <div class="notice-title">"Your current subscription only included 2 myths debunked."</div>
            <div class="notice-subtext">You will need an appointment for more... 📑</div>
        </div>

        <!-- Character & Pop-up Bubble -->
        <div class="character-container">
            <!-- Speech bubble pops up automatically over character -->
            <div class="speech-bubble" id="speechBubble">
                <span class="speech-text">Here goes nothing... 🤞</span>
                <a href="page5.html" class="bubble-btn">Book Appointment ➔</a>
            </div>
            <img src="character3.png" alt="Character" class="character-img">
        </div>
    </div>

    <script>
        // Auto-trigger speech bubble after 2 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('speechBubble').classList.add('show');
            }, 6000);
        });
    </script>

</body>
</html>
