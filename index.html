<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            
            /* Background image configuration */
            background-image: url('BG_00.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Container to stack the top title and card vertically */
        .page-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Title in the blue sky area */
        .top-title {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        /* Mobile layout container */
        .mobile-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 36px 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .badge {
            display: inline-block;
            background-color: #fef3c7;
            color: #92400e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.75rem;
            color: #1a202c;
            margin-bottom: 14px;
            font-weight: 700;
            line-height: 1.25;
        }

        p {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 28px;
        }

        .cta-button {
            display: inline-block;
            width: 100%;
            background-color: #2b5c53; /* Deep Ghibli Green */
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(43, 92, 83, 0.25);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .cta-button:active {
            transform: scale(0.97);
            background-color: #214740;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- New title placed in the sky area -->
        <h2 class="top-title">MythBusters</h2>

        <div class="mobile-card">
            <span class="badge">🔍 Fact-Check Bureau</span>
            <h1>Rumor Has It... 🍿</h1>
            <p>Before you believe everything you've heard, let’s explore what's actually true vs. total fake news.</p>
            <a href="page2.html" class="cta-button">Reveal The Truth ➔</a>
        </div>
    </div>

</body>
</html>
